{# One UX-only modal shared by both base templates. It has no Django or server-side behaviour. #}
<div x-data="gahkchaModal" x-cloak x-show="open" class="gahkcha-layer" aria-live="polite">
  {# x-if keeps all 16 <img>s out of the DOM (and off the network) until a challenge opens. #}
  <template x-if="open"><div class="gahkcha-mounted">
    <div class="gahkcha-backdrop" @click="skip()"></div>
    <section class="gahkcha-dialog" data-gahkcha-dialog role="dialog" aria-modal="true"
           aria-labelledby="gahkcha-title" aria-describedby="gahkcha-prompt" tabindex="-1">
    <div class="gahkcha-heading">
      <div>
        <p class="gahkcha-kicker">GAHKCHA · helt uofficiel</p>
        <h2 id="gahkcha-title" x-text="challenge.title"></h2>
      </div>
      <button type="button" class="gahkcha-skip" @click="skip()">Spring over</button>
    </div>
    <p class="gahkcha-prompt" id="gahkcha-prompt" x-text="challenge.prompt"></p>
    <div class="gahkcha-grid" role="group" :aria-label="challenge.prompt">
      <template x-for="(image, index) in challenge.images" :key="image.src">
        <button type="button" class="gahkcha-tile" @click="toggle(index)"
                :class="{ 'is-selected': selectedIndexes.includes(index) }"
                :aria-pressed="selectedIndexes.includes(index)" :aria-label="image.alt">
          <img x-show="!failedImageIndexes.includes(index)" :src="image.src" :alt="image.alt"
               @error="markImageFailed(index)">
          <span x-show="failedImageIndexes.includes(index)" class="gahkcha-image-fallback" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8" cy="9" r="1.5"></circle><path d="m4 18 5-5 3 3 3-3 5 5"></path></svg>
            <span>Demo</span>
          </span>
        </button>
      </template>
    </div>
    <p class="gahkcha-feedback" :class="{ 'is-success': succeeded }" x-show="feedback" x-text="feedback" role="status"></p>
    <div class="gahkcha-actions">
      <button type="button" class="btn btn-secondary" @click="skip()">Spring over</button>
      <button type="button" class="btn" @click="confirm()" :disabled="succeeded">Bekræft</button>
    </div>
    </section>
  </div></template>
</div>

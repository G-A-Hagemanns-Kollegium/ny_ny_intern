{% extends "kiosk_base.html" %}
{% block title %}Ølkælderen — Tillen{% endblock %}
{% block content %}
  {{ product_data|json_script:"kiosk-products" }}
  {{ shopper_data|json_script:"kiosk-shoppers" }}

  <div x-data="kiosk" class="select-none">
    <h1 class="text-2xl font-bold mb-3">Ølkælderen</h1>
    <div class="grid gap-4 lg:grid-cols-[3fr_2fr]">

      <!-- Varer: tap a tile to add one; steppers adjust -->
      <section>
        <h2 class="text-lg font-semibold mb-2">Varer</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-[78vh] overflow-auto pr-1 pb-1">
          <template x-for="p in products" :key="p.id">
            <div @click="add(p.id)"
                 class="relative flex flex-col min-h-40 border border-gray-200 rounded-xl p-3 bg-white
                        cursor-pointer touch-manipulation transition active:scale-[.98]"
                 :class="qty(p.id) > 0 ? 'ring-2 ring-emerald-500' : ''">
              <span x-show="qty(p.id) > 0"
                    class="absolute top-2 right-2 min-w-7 h-7 px-1 grid place-items-center rounded-full
                           bg-emerald-600 text-white text-sm font-bold" x-text="qty(p.id)"></span>
              <template x-if="p.img">
                <img :src="p.img" alt="" class="h-24 w-full object-contain mb-2 pointer-events-none">
              </template>
              <span class="font-medium leading-tight" x-text="p.name"></span>
              <span class="muted text-sm" x-text="kr(p.price_ore)"></span>
              <div class="mt-auto flex items-center justify-between pt-3">
                <button type="button" @click.stop="sub(p.id)"
                        class="w-14 h-14 grid place-items-center text-2xl rounded-lg bg-gray-100 text-gray-900
                               active:bg-gray-200 touch-manipulation">−</button>
                <span class="text-lg font-semibold w-8 text-center" x-text="qty(p.id)"></span>
                <button type="button" @click.stop="add(p.id)"
                        class="w-14 h-14 grid place-items-center text-2xl rounded-lg bg-emerald-600 text-white
                               active:bg-emerald-700 touch-manipulation">+</button>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- Købere + kurv -->
      <section>
        <h2 class="text-lg font-semibold mb-2">Hvem køber?
          <span class="muted font-normal text-sm">(deles ligeligt)</span></h2>
        <input type="search" x-model="filter" placeholder="Søg navn eller nr…" class="mb-2 text-base py-3">
        <div class="grid grid-cols-2 gap-3 max-h-96 overflow-auto pr-1 pb-1">
          <template x-for="s in shownShoppers" :key="s.id">
            <button type="button" @click="toggle(s.id)"
                    :class="isChosen(s.id) ? 'ring-2 ring-emerald-600 bg-emerald-50 text-emerald-900' : 'bg-white text-gray-800'"
                    class="min-h-16 border border-gray-200 rounded-xl p-3 text-left touch-manipulation
                           transition active:scale-[.98]">
              <span class="block text-base font-medium leading-tight" x-text="s.name"></span>
              <span class="muted text-xs" x-text="'#' + s.rid"></span>
            </button>
          </template>
        </div>

        <div class="card mt-4 sticky bottom-2">
          <div class="flex justify-between text-xl">
            <span>I alt</span><strong x-text="kr(totalOre)"></strong>
          </div>
          <div class="flex justify-between muted mt-1" x-show="chosen.length > 0">
            <span x-text="'Pr. person (' + chosen.length + ')'"></span>
            <span x-text="kr(perPersonOre)"></span>
          </div>
          <form method="post" action="{% url 'oelkaelder:purchase' %}">
            {% csrf_token %}
            <template x-for="id in chosen" :key="'s' + id">
              <input type="hidden" name="shopper" :value="id">
            </template>
            <template x-for="p in products" :key="'q' + p.id">
              <input type="hidden" :name="'qty_' + p.id" :value="qty(p.id)">
            </template>
            <button type="submit" :disabled="!canSubmit"
                    class="w-full mt-3 py-4 text-xl rounded-lg bg-emerald-600 text-white touch-manipulation
                           active:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed"
                    x-text="canSubmit ? ('Registrér køb — ' + kr(totalOre)) : 'Vælg vare og køber'"></button>
          </form>
        </div>
      </section>
    </div>
  </div>
{% endblock %}

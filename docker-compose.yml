# ETL / dev databases (02-schema-etl.md §8).
#   - mariadb : staging copy of the legacy dump (gahk_dk.sql auto-loaded on first init)
#   - postgres: target for the clean Django schema + pgloader 1:1 staging schema
#   - pgloader: one-shot MySQL->Postgres bulk lift (run via `docker compose run --rm pgloader ...`)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gahk
      POSTGRES_USER: gahk
      POSTGRES_PASSWORD: gahk
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gahk"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: gahk_dk
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: gahk
      MARIADB_PASSWORD: gahk
    ports: ["3306:3306"]
    command: ["--max-allowed-packet=256M"]
    volumes:
      - "mariadbdata:/var/lib/mysql"
      - "./gahk_dk.sql:/docker-entrypoint-initdb.d/01-gahk_dk.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  pgloader:
    image: dimitri/pgloader:latest
    profiles: ["etl"]
    depends_on:
      postgres: {condition: service_healthy}
      mariadb: {condition: service_healthy}
    entrypoint: ["sleep", "infinity"]   # kept idle; run pgloader manually inside it

volumes:
  pgdata:
  mariadbdata:
